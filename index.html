<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>sPg Material Radar Signature & Crafting Quality – Balra zárt V4</title>
<style>
:root{
  --bg:#090d12; --panel:#0d131b; --panel2:#101923; --line:#243142; --line2:#1b2634;
  --text:#d7e2ee; --muted:#8794a5;
  --legendary:#ffad19; --epic:#c75cff; --rare:#2b9cff; --uncommon:#2bd1b1; --common:#8c9aaa;
  --roc:#66dfa9; --fps:#71badc; --salvage:#c8a969; --unknown:#7d8794;
  --accent:#00d9ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Roboto,Arial,Helvetica,sans-serif;
}
.app{max-width:1600px;margin:0 auto;padding:14px}
.topbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 14px;margin-bottom:12px;border:1px solid #1b2b3d;
  background:linear-gradient(180deg,#101721,#0a1017);border-radius:12px;
}
.topbar h1{font:700 18px/1.2 Orbitron,Roboto,Arial,sans-serif;margin:0 auto 0 0;color:#eef7ff}
button,select{
  min-height:36px;border-radius:8px;border:1px solid #29445b;background:#0b131c;color:#dbe8f3;
  padding:0 10px;font-weight:700
}
button{cursor:pointer}
button.active{border-color:#d49a1e;color:#ffd26a;background:#1f190c}
.chart-shell{
  border:1px solid #1e2a39;background:#080c11;border-radius:12px;overflow:hidden;
}
.chart-head{
  display:grid;grid-template-columns:180px 1fr;
  border-bottom:1px solid #1b2634;background:#0c1118;
}
.chart-head .left{padding:10px 12px;color:#7f8c9c;font-size:11px;font-weight:800;text-transform:uppercase}
.scale{
  position:relative;height:34px;
}
.tick{
  position:absolute;bottom:0;transform:translateX(-50%);color:#526072;font:700 10px/1 ui-monospace,Consolas,monospace;
}
.tick::before{
  content:"";position:absolute;bottom:14px;left:50%;width:1px;height:13px;background:#2b3949;
}
.radar-section{border-top:1px solid #121b25}
.radar-row{
  --c:var(--unknown);
  display:grid;grid-template-columns:180px 1fr;min-height:28px;
  position:relative;cursor:pointer;transition:.14s ease;
}
.radar-row:hover{background:color-mix(in srgb,var(--c) 5%,transparent)}
.radar-row.selected{
  min-height:84px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 60%);
}
.material-label{
  display:flex;align-items:center;justify-content:flex-end;padding:3px 18px 3px 8px;
  color:var(--c);font:800 12px/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.01em;white-space:nowrap;
}
.radar-row.selected .material-label{font-size:23px}
.track{
  position:relative;min-height:28px;border-left:1px solid #263345;
  background-image:linear-gradient(to right,transparent calc(16.666% - 1px),#1c2836 16.666%,transparent calc(16.666% + 1px));
}
.track::after{
  content:"";position:absolute;top:0;bottom:0;left:8%;width:1px;background:#33465a;opacity:.8;pointer-events:none;
}
.track::before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(to right,transparent 16.666%,#1c2836 16.666%,#1c2836 calc(16.666% + 1px),transparent calc(16.666% + 1px)),
    linear-gradient(to right,transparent 33.333%,#1c2836 33.333%,#1c2836 calc(33.333% + 1px),transparent calc(33.333% + 1px)),
    linear-gradient(to right,transparent 50%,#1c2836 50%,#1c2836 calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(to right,transparent 66.666%,#1c2836 66.666%,#1c2836 calc(66.666% + 1px),transparent calc(66.666% + 1px)),
    linear-gradient(to right,transparent 83.333%,#1c2836 83.333%,#1c2836 calc(83.333% + 1px),transparent calc(83.333% + 1px));
  pointer-events:none;
}
.sig-line{
  position:absolute;top:50%;height:1px;background:color-mix(in srgb,var(--c) 72%,transparent);
  transform:translateY(-50%);
}
.sig-chip{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  color:var(--c);border:1px solid var(--c);background:#081019;
  border-radius:999px;padding:2px 7px;font:800 11px/1.15 ui-monospace,SFMono-Regular,Consolas,monospace;
  white-space:nowrap;box-shadow:0 0 7px color-mix(in srgb,var(--c) 15%,transparent);
}
.radar-row.selected .sig-chip{font-size:16.5px;padding:5px 12px}
.radar-row.selected .sig-line{height:2px}
.details{
  display:none;grid-column:1/-1;margin:0 12px 10px 192px;padding:10px 12px;
  border:1px solid color-mix(in srgb,var(--c) 35%,transparent);
  border-radius:10px;background:#0b1118;
}
.radar-row.selected .details{display:block}
.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail h3{margin:0 0 6px;font:800 13.2px/1.2 Orbitron,Roboto,Arial,sans-serif;color:#eef7ff}
.detail ul{margin:0;padding-left:18px;color:#cbd7e2;font-size:13.2px;line-height:1.55}
.detail p{margin:0;color:#8f9baa;font-size:13.2px;line-height:1.5}
.empty-note{color:#617081;font-style:italic}
.group-gap{height:10px;border-top:1px solid #243142}
.legend{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;
  border-top:1px solid #263445;background:#0b1017;color:#8b98a9;font-size:10px
}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.quality-banner{
  display:none;margin:10px 0;padding:8px 10px;border:1px solid #23364a;border-radius:8px;background:#0b131c;color:#9caabc;font-size:12px
}
.quality-banner.show{display:block}
.footer{padding:10px 4px;color:#617081;font-size:10px;text-align:center}
@media(max-width:800px){
  .chart-head,.radar-row{grid-template-columns:125px 1fr}
  .material-label{padding-right:8px;font-size:10px}
  .details{margin-left:136px}
  .details-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>sPg Material Radar Signature & Crafting Quality – Balra zárt V4</h1>
    <select id="mode">
      <option value="radar">Radar sorrend</option>
      <option value="q500">Q500 · HP / Integrity</option>
      <option value="qhigh">Q900+ · Funkcionális</option>
    </select>
    <button id="craftOnly" class="active">Csak crafting anyagok</button>
    <button id="clear">Kiemelés törlése</button>
  </div>

  <div id="qualityBanner" class="quality-banner"></div>

  <section class="chart-shell">
    <div class="chart-head">
      <div class="left">Anyag</div>
      <div class="scale" id="scale"></div>
    </div>
    <div id="rows"></div>
    <div class="legend">
      <span style="--c:var(--legendary)"><i></i>Legendary (Max 2×)</span>
      <span style="--c:var(--epic)"><i></i>Epic (Max 3×)</span>
      <span style="--c:var(--rare)"><i></i>Rare (Max 4×)</span>
      <span style="--c:var(--uncommon)"><i></i>Uncommon (Max 5×)</span>
      <span style="--c:var(--common)"><i></i>Common (Max 6×)</span>
      <span style="--c:var(--roc)"><i></i>ROC Mineables</span>
      <span style="--c:var(--fps)"><i></i>FPS Mineables</span>
    </div>
  </section>
  <div class="footer">Minden sor első radarjele ugyanarról a bal oldali kezdővonalról indul. Kattints egy anyagra a 3× nagy kiemeléshez.</div>
</div>

<script>
const MATERIALS = [{"name":"Agricium","q500":["Shield Generator → Shell","Quantum Drive → Case","Radar → Case","Ship Weapon → Frame / Reinforced Frame"],"qHigh":["Cooler → Pump Impeller","Radar → Signal Processor"],"rarity":"uncommon","radarBase":3885,"radarCount":5,"mining":"Ship Mining","source":"Agricium","order":16,"displayName":"Agricium"},{"name":"Aluminum","q500":[],"qHigh":[],"rarity":"common","radarBase":4285,"radarCount":6,"mining":"Ship Mining","source":"Aluminium","order":25,"displayName":"Aluminum"},{"name":"Aphorite","q500":[],"qHigh":["Ship Weapon → Distorter Unit"],"rarity":"fps","radarBase":3000,"radarCount":10,"mining":"FPS Mining","source":"FPS Mineables","order":30,"displayName":"Aphorite"},{"name":"Aslarite","q500":[],"qHigh":[],"rarity":"uncommon","radarBase":3840,"radarCount":5,"mining":"Ship Mining","source":"Aslarite","order":13,"displayName":"Aslarite"},{"name":"Beradom","q500":[],"qHigh":["Shield Generator → Frequency Controller"],"rarity":"roc","radarBase":4000,"radarCount":7,"mining":"ROC / Ground Vehicle","source":"ROC Mineables","order":27,"alias":"Beradon","displayName":"Beradom"},{"name":"Beryl","q500":[],"qHigh":["Power Plant → Voltage Regulator","Quantum Drive → Containment Matrix"],"rarity":"rare","radarBase":3540,"radarCount":4,"mining":"Ship Mining","source":"Beryl","order":7,"displayName":"Beryl"},{"name":"Bexalite","q500":[],"qHigh":["Quantum Drive → Containment Matrix","Radar → Transmitter"],"rarity":"rare","radarBase":3600,"radarCount":4,"mining":"Ship Mining","source":"Bexalite","order":11,"displayName":"Bexalite"},{"name":"Borase","q500":["Power Plant → Shell","Shield Generator → Shell","Cooler → Shell","Quantum Drive → Case","Radar → Case","Ship Weapon → Reinforced Frame"],"qHigh":["Cooler → Pump Impeller"],"rarity":"rare","radarBase":3570,"radarCount":4,"mining":"Ship Mining","source":"Borase","order":9,"displayName":"Borase"},{"name":"Copper","q500":[],"qHigh":["Ship Weapon → Wiring"],"rarity":"common","radarBase":4240,"radarCount":6,"mining":"Ship Mining","source":"Copper","order":22,"displayName":"Copper"},{"name":"Corundum","q500":[],"qHigh":["Shield Generator → Field Array"],"rarity":"common","radarBase":4225,"radarCount":6,"mining":"Ship Mining","source":"Corundum","order":21,"displayName":"Corundum"},{"name":"Dolivine","q500":[],"qHigh":["Ship Weapon → Aperture Iris"],"rarity":"fps","radarBase":3000,"radarCount":10,"mining":"FPS Mining","source":"FPS Mineables","order":31,"displayName":"Dolivine"},{"name":"Feynmaline","q500":[],"qHigh":["Shield Generator → Frequency Controller"],"rarity":"roc","radarBase":4000,"radarCount":7,"mining":"ROC / Ground Vehicle","source":"ROC Mineables","order":28,"displayName":"Feynmaline"},{"name":"Glacosite","q500":[],"qHigh":["Shield Generator → Frequency Controller"],"rarity":"roc","radarBase":4000,"radarCount":7,"mining":"ROC / Ground Vehicle","source":"ROC Mineables","order":29,"displayName":"Glacosite"},{"name":"Gold","q500":[],"qHigh":["Shield Generator → Field Array","Radar → Signal Processor","Ship Weapon → Wiring / Electronics"],"rarity":"rare","radarBase":3585,"radarCount":4,"mining":"Ship Mining","source":"Gold","order":10,"displayName":"Gold"},{"name":"Hadanite","q500":[],"qHigh":["Ship Weapon → Emitter"],"rarity":"fps","radarBase":3000,"radarCount":10,"mining":"FPS Mining","source":"FPS Mineables","order":32,"displayName":"Hadanite"},{"name":"Hephaestanite","q500":[],"qHigh":["Quantum Drive → Containment Matrix"],"rarity":"common","radarBase":4180,"radarCount":6,"mining":"Ship Mining","source":"Hephaestanite","order":18,"displayName":"Hephaestanite"},{"name":"Ice","q500":[],"qHigh":[],"rarity":"common","radarBase":4300,"radarCount":6,"mining":"Ship Mining","source":"Ice","order":26,"displayName":"Ice"},{"name":"Iron","q500":["Power Plant → Shell","Quantum Drive → Case","Ship Weapon → Frame"],"qHigh":["Cooler → Pump Impeller","Quantum Drive → Injector Nozzles"],"rarity":"common","radarBase":4270,"radarCount":6,"mining":"Ship Mining","source":"Iron","order":24,"displayName":"Iron"},{"name":"Janalite","q500":[],"qHigh":[],"rarity":"fps","radarBase":3000,"radarCount":10,"mining":"FPS Mining","source":"FPS Mineables","order":33,"displayName":"Janalite"},{"name":"Laranite","q500":[],"qHigh":["Power Plant → Voltage Regulator / Stator Cores","Shield Generator → Field Array","Quantum Drive → Containment Matrix","Radar → Transmitter"],"rarity":"uncommon","radarBase":3825,"radarCount":5,"mining":"Ship Mining","source":"Laranite","order":12,"displayName":"Laranite"},{"name":"Lindinium","q500":["Power Plant → Shell"],"qHigh":["Radar → Signal Processor","Ship Weapon → Radiator"],"rarity":"epic","radarBase":3400,"radarCount":3,"mining":"Ship Mining","source":"Lindinium","order":6,"displayName":"Lindinium"},{"name":"Ouratite","q500":[],"qHigh":["Power Plant → Stator Cores","Quantum Drive → Containment Matrix","Ship Weapon → Drive Motor"],"rarity":"epic","radarBase":3370,"radarCount":3,"mining":"Ship Mining","source":"Ouratite","order":4,"displayName":"Ouratite"},{"name":"Pressurized Ice","q500":[],"qHigh":["Cooler → Coolant","Ship Weapon → Thermal Sink"],"rarity":"unknown","radarBase":null,"radarCount":0,"mining":"—","source":"Nincs a referencia-képen","order":90,"displayName":"Pressurized Ice"},{"name":"Quantainium","q500":[],"qHigh":["Ship Weapon → Acceleration Unit"],"rarity":"legendary","radarBase":3170,"radarCount":2,"mining":"Ship Mining","source":"Quantainium","order":1,"displayName":"Quantanium"},{"name":"Quartz","q500":[],"qHigh":["Radar → Transmitter"],"rarity":"common","radarBase":4210,"radarCount":6,"mining":"Ship Mining","source":"Quartz","order":20,"displayName":"Quartz"},{"name":"Riccite","q500":["Power Plant → Shell","Shield Generator → Shell","Cooler → Shell"],"qHigh":["Power Plant → Stator Cores","Shield Generator → Field Array","Radar → Signal Processor","Ship Weapon → Cycler"],"rarity":"epic","radarBase":3385,"radarCount":3,"mining":"Ship Mining","source":"Riccite","order":5,"displayName":"Riccite"},{"name":"Saldynium (Ore)","q500":[],"qHigh":["Ship Weapon → Magnetizer"],"rarity":"unknown","radarBase":null,"radarCount":0,"mining":"—","source":"Nincs a referencia-képen","order":91,"displayName":"Saldynium (Ore)"},{"name":"Savrilium","q500":["Shield Generator → Shell"],"qHigh":["Power Plant → Stator Cores","Shield Generator → Field Array","Quantum Drive → Containment Matrix","Radar → Signal Processor","Ship Weapon → Torque Junction"],"rarity":"legendary","radarBase":3200,"radarCount":2,"mining":"Ship Mining","source":"Savrilium","order":3,"displayName":"Savrilium"},{"name":"Silicon","q500":[],"qHigh":["Power Plant → Voltage Regulator / Stator Cores","Radar → Signal Processor"],"rarity":"common","radarBase":4255,"radarCount":6,"mining":"Ship Mining","source":"Silicon","order":23,"displayName":"Silicon"},{"name":"Stileron","q500":["Power Plant → Shell","Cooler → Shell"],"qHigh":["Quantum Drive → Containment Matrix","Radar → Signal Processor"],"rarity":"legendary","radarBase":3185,"radarCount":2,"mining":"Ship Mining","source":"Stileron","order":2,"displayName":"Stileron"},{"name":"Taranite","q500":[],"qHigh":["Power Plant → Stator Cores"],"rarity":"rare","radarBase":3555,"radarCount":4,"mining":"Ship Mining","source":"Taranite","order":8,"displayName":"Taranite"},{"name":"Tin","q500":["Shield Generator → Shell","Quantum Drive → Case","Radar → Case"],"qHigh":[],"rarity":"common","radarBase":4195,"radarCount":6,"mining":"Ship Mining","source":"Tin","order":19,"displayName":"Tin"},{"name":"Titanium","q500":["Shield Generator → Shell","Radar → Case","Ship Weapon → Frame / Reinforced Frame"],"qHigh":["Cooler → Pump Impeller","Ship Weapon → Barrel"],"rarity":"uncommon","radarBase":3855,"radarCount":5,"mining":"Ship Mining","source":"Titanium","order":14,"displayName":"Titanium"},{"name":"Torite","q500":["Power Plant → Shell","Shield Generator → Shell","Cooler → Shell","Quantum Drive → Case","Radar → Case"],"qHigh":["Ship Weapon → Radiator"],"rarity":"uncommon","radarBase":3900,"radarCount":5,"mining":"Ship Mining","source":"Torite","order":17,"displayName":"Torite"},{"name":"Tungsten","q500":["Shield Generator → Shell","Cooler → Shell","Quantum Drive → Case","Ship Weapon → Frame / Reinforced Frame"],"qHigh":["Cooler → Pump Impeller","Quantum Drive → Injector Nozzles","Ship Weapon → Barrels"],"rarity":"uncommon","radarBase":3870,"radarCount":5,"mining":"Ship Mining","source":"Tungsten","order":15,"displayName":"Tungsten"}];
const MAX=30000;
const START_PCT=8; // minden sor első radarjele ugyaninnen indul
const RARITY={
  legendary:{color:"#ffad19",rank:1}, epic:{color:"#c75cff",rank:2},
  rare:{color:"#2b9cff",rank:3}, uncommon:{color:"#2bd1b1",rank:4},
  common:{color:"#8c9aaa",rank:5}, roc:{color:"#66dfa9",rank:6},
  fps:{color:"#71badc",rank:7}, unknown:{color:"#7d8794",rank:8}
};
const state={mode:"radar",craftOnly:true,selected:new Set()};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function fmt(n){return new Intl.NumberFormat("hu-HU",{maximumFractionDigits:0}).format(n)}
function radarVals(m){return m.radarBase&&m.radarCount?Array.from({length:m.radarCount},(_,i)=>m.radarBase*(i+1)):[]}
function hasCraft(m){return m.q500.length||m.qHigh.length}
function color(m){return (RARITY[m.rarity]||RARITY.unknown).color}
function scale(){
  const root=document.getElementById("scale");
  root.innerHTML=[5000,10000,15000,20000,25000,30000].map(v=>`<span class="tick" style="left:${v/MAX*100}%">${v/1000}k</span>`).join("");
}
function sortRadar(a,b){
  return (a.order??999)-(b.order??999) || a.displayName.localeCompare(b.displayName,"hu");
}
function row(m){
  const c=color(m), vals=radarVals(m), selected=state.selected.has(m.name);
  let filtered=true;
  if(state.mode==="q500") filtered=m.q500.length>0;
  if(state.mode==="qhigh") filtered=m.qHigh.length>0;
  if(!filtered) return "";
  const first=vals[0]||0;
  const positions=vals.map((v,i)=>START_PCT + ((v-first)/MAX*100));
  const firstPos=positions[0]||START_PCT;
  const lastPos=positions[positions.length-1]||START_PCT;
  const line=vals.length?`<span class="sig-line" style="left:${firstPos}%;width:${Math.max(0,lastPos-firstPos)}%"></span>`:"";
  const chips=vals.map((v,i)=>`<span class="sig-chip" style="left:${positions[i]}%">${fmt(v)}</span>`).join("");
  const q500=m.q500.length?`<ul>${m.q500.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="empty-note">Nincs Q500-as HP / Integrity felhasználás.</p>`;
  const qh=m.qHigh.length?`<ul>${m.qHigh.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="empty-note">Nincs Q900+ funkcionális felhasználás.</p>`;
  const radarText=vals.length?`${m.mining} · ${m.radarCount} lehetséges jel · alap ${fmt(m.radarBase)}`:"Nincs radarérték a referencia-képen.";
  return `<div class="radar-row ${selected?"selected":""}" data-name="${esc(m.name)}" style="--c:${c}">
    <div class="material-label">${esc(m.displayName||m.name)}</div>
    <div class="track">${line}${chips}</div>
    <div class="details">
      <div class="details-grid">
        <div class="detail"><h3>Q500 · HP / Integrity</h3>${q500}</div>
        <div class="detail"><h3>Q900+ · Funkcionális</h3>${qh}</div>
        <div class="detail" style="grid-column:1/-1"><h3>Radar</h3><p>${radarText}</p></div>
      </div>
    </div>
  </div>`;
}
function render(){
  state.mode=document.getElementById("mode").value;
  let items=MATERIALS.slice().sort(sortRadar);
  if(state.craftOnly) items=items.filter(hasCraft);
  const rows=[];
  let prevRank=null;
  for(const m of items){
    const rank=(RARITY[m.rarity]||RARITY.unknown).rank;
    const html=row(m);
    if(!html) continue;
    if(prevRank!==null && rank!==prevRank) rows.push(`<div class="group-gap"></div>`);
    rows.push(html); prevRank=rank;
  }
  document.getElementById("rows").innerHTML=rows.join("");
  const banner=document.getElementById("qualityBanner");
  if(state.mode==="q500"){banner.textContent="Q500 nézet: csak a HP / Integrity alkatrészekhez használt anyagok, radar-sorrendben.";banner.classList.add("show")}
  else if(state.mode==="qhigh"){banner.textContent="Q900+ nézet: minden nem HP / Integrity funkcionális alkatrészhez használt anyag, radar-sorrendben.";banner.classList.add("show")}
  else banner.classList.remove("show");

  document.querySelectorAll(".radar-row").forEach(el=>{
    const toggle=()=>{const n=el.dataset.name;state.selected.has(n)?state.selected.delete(n):state.selected.add(n);render()};
    el.addEventListener("click",toggle);
  });
}
document.getElementById("mode").addEventListener("change",render);
document.getElementById("craftOnly").addEventListener("click",()=>{
  state.craftOnly=!state.craftOnly;
  const b=document.getElementById("craftOnly");
  b.classList.toggle("active",state.craftOnly);
  b.textContent=state.craftOnly?"Csak crafting anyagok":"Minden radaranyag";
  render();
});
document.getElementById("clear").addEventListener("click",()=>{state.selected.clear();render()});
scale();render();
</script>
</body>
</html>
